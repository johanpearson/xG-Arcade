name: clean-duplicate-career-stints

# Bug fix (2026-08-04, xG Path duplicate-node bug, REQ-1203 follow-up,
# ADR-0059): manual, one-off maintenance tool (DuplicateCareerStintCleaner's
# own doc comment has the full reasoning) for the pre-existing cross-writer
# PlayerCareerStint duplicates this fix's canonicalization prevents going
# forward but cannot retroactively repair on its own (no QID is stored on
# an already-persisted row to re-canonicalize against).
#
# Same "reads its own scope from the database, no operator-supplied input"
# shape as clear-pair-lookup-failures.yml — a row is only ever removed when
# an already-canonical counterpart for the exact same real stint is already
# present, so no confirmation input is required (contrast purge-player-pool's
# required exact-phrase confirmation for its much more destructive, unscoped
# write). Safe to re-run: a second run simply finds nothing left to clean.
#
# Weekly cron (2026-08-16, xG Path duplicate-club report follow-up): this was
# manual-only, so new cross-writer duplicates (still possible for shapes
# ADR-0059's canonicalization doesn't cover, e.g. null-vs-populated
# AppearanceCount per ADR-0063) accumulated silently between whoever
# remembered to click "Run workflow." Scheduled an hour after
# prefetch-player-careers.yml's own weekly slot so any duplicates that job's
# additive writes introduce get cleaned up within the same weekly cycle.
# workflow_dispatch stays available for an on-demand run.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 8 * * 0" # weekly, Sunday 08:00 UTC

jobs:
  clean-duplicate-career-stints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Clean duplicate career stints
        run: dotnet run --project backend/src/XGArcade.Api -- clean-duplicate-career-stints
        env:
          ConnectionStrings__Database: ${{ secrets.DEV_DATABASE_CONNECTION_STRING }}
