name: import-player-name-index

# S-032 (ADR-0007/REQ-207): bulk-populates PlayerNameIndex (COMP-10) from a
# broad "association football player" Wikidata SPARQL query, so autocomplete
# (REQ-207) has many thousands of names to suggest from — deliberately
# separate from PlayerAttribute's narrow, incrementally-built validation
# cache (see PlayerNameIndexImporter's own doc comment and ADR-0007 for why).
#
# A plain CLI job (`dotnet run -- import-player-name-index`), not an HTTP
# endpoint against the deployed backend — same "long-running bulk job is a
# CLI verb, never a fire-and-forget background task or a long HTTP endpoint"
# reasoning as warm-grid-cache.yml (ADR-0024): the import runs one bounded
# Wikidata query per birth year (1939 → current year, ~90 queries with
# per-slice retries) and can run far longer than the deployed backend's
# ~240s HTTP ingress timeout allows. Fail-loud contract (2026-07-18): if any
# birth-year slice still fails after its retries, the verb exits nonzero and
# this run goes red — a red run means "re-run the job" (it's idempotent),
# NOT "raise a timeout"; see NOTES.md's 2026-07-17/18 entries.
#
# Weekly cron (ADR-0055, 2026-08-02) — supersedes the original "manual only"
# note: ADR-0007's own follow-up said start manual/periodic and tighten if
# names are noticeably missing, and NOTES.md's 2026-08-02 entry recorded
# exactly that gap in practice (a code fix landed, but needed a human to
# remember to click "Run workflow" for it to actually take effect). A weekly
# cadence keeps the autocomplete index from silently drifting stale between
# manual runs; workflow_dispatch stays available for an on-demand refresh
# (e.g. right after a normalizer fix, per NOTES.md's own guidance).

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * 0" # weekly, Sunday 03:00 UTC

# REQ-110/ADR-0088/S-186 (2026-08-25, Supabase free-tier egress incident): a
# burst of manual re-dispatches of this and the other three bulk Wikidata
# jobs is a confirmed contributor to a real egress-quota incident — queue
# (never cancel) a second dispatch instead of letting two full sweeps run
# concurrently against Supabase. cancel-in-progress: false because a real
# in-flight sweep is expensive to redo.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  import-player-name-index:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Import player name index
        uses: ./.github/actions/run-cli-verb
        with:
          verb: import-player-name-index
          connection-string: ${{ secrets.DEV_DATABASE_CONNECTION_STRING }}
