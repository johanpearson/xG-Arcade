name: warm-player-cache

# REQ-110 (ADR-0023's follow-up): proactively fills the PlayerAttribute
# cache for every reference Country x Club / Club x Club pair, so a real
# generate-round.yml run can resolve almost entirely from cache instead of
# gambling on live Wikidata lookups for an unlucky row header — see
# NOTES.md's 2026-07-13 entry and
# docs/decisions/0023-grid-generation-wall-clock-deadline.md.
#
# A plain CLI job (`dotnet run -- warm-player-cache`, PlayerCacheWarmingService's
# own doc comment has the full reasoning), not an HTTP endpoint against the
# deployed backend — this can take a long time (up to a few hundred live
# Wikidata calls), and a GitHub Actions job has a generous default timeout
# unlike the deployed backend's own HTTP ingress (~240s, the exact wall
# ADR-0023 had to work around for round generation).
#
# Weekly cron (ADR-0055, 2026-08-02) — supersedes the original "manual only,
# run after any reference-data change" note: a recurring cadence is cheap
# now that ConfirmedLowMatchPair/PairLookupFailure (ADR-0050/ADR-0052) skip
# already-confirmed-low or persistently-failing pairs without a live query,
# so a repeat run mostly costs time on genuinely new or previously-failed
# pairs, not a full re-sweep. Offset 90 minutes after
# import-player-name-index.yml's own weekly run so the two bulk jobs don't
# compete for the same time slot (not a hard dependency between them —
# either can run standalone). workflow_dispatch stays available for an
# on-demand run right after a reference-data change, same as before.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 4 * * 0" # weekly, Sunday 04:30 UTC

jobs:
  warm-player-cache:
    runs-on: ubuntu-latest
    # 2026-08-17 incident: the first run against a fully-purged pool (no
    # ConfirmedLowMatchPair/PairLookupFailure rows left to skip anything —
    # purge-player-pool clears both, S-038/ADR-0025) got killed by this
    # job's own 90-minute cap mid-sweep — the "repeat run is cheap" claim
    # above depends entirely on those skip-tables being populated, which a
    # cold run after a purge starts without. Raised to give a genuine cold
    # sweep room to finish and start populating those tables; a routine
    # weekly run against an already-warm cache stays far under this.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # Bug-bundle follow-up (2026-07-27): retries the whole command if the
      # process itself crashes/exits non-zero (e.g. a DB connection drop) —
      # PlayerCacheWarmingService.WarmAsync is idempotent and safe to re-run
      # (its own doc comment), and a real run comfortably finishes in ~30 of
      # this job's 90-minute budget, so 2 attempts fits well within it. This
      # is NOT the mechanism for a single pair's Wikidata query timing out —
      # WikidataClient already swallows that internally and keeps going
      # (now with a warning logged per pair, see WikidataClient.cs's
      # timeout-branch comment), so a crash here means something actually
      # broke, not just an unlucky slow query. If specific pairs are still
      # missing after a clean run, just re-dispatch this workflow again — it
      # skips anything already cached and only re-queries what's still
      # missing, so a fresh run is the right lever for "a few pairs got
      # unlucky," not a build-in retry loop here.
      - name: Warm player cache
        run: |
          max_attempts=2
          for attempt in $(seq 1 "$max_attempts"); do
            if dotnet run --project backend/src/XGArcade.Api -- warm-player-cache; then
              exit 0
            fi

            echo "::warning::warm-player-cache exited non-zero (attempt $attempt/$max_attempts)"
          done

          echo "::error::warm-player-cache failed after $max_attempts attempts"
          exit 1
        env:
          ConnectionStrings__Database: ${{ secrets.DEV_DATABASE_CONNECTION_STRING }}
