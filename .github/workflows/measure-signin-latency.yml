name: measure-signin-latency

# Diagnostic-only, workflow_dispatch-only tool for investigating the
# "sign-in feels slow" report (see NOTES.md's 2026-07-25 captcha entry and
# infra/README.md's cost table). Never scheduled, never runs on push —
# this exists purely to gather real, timestamped latency numbers against
# the live dev environment (a GitHub Actions runner has real internet
# access; this repo's own dev sandboxes are proxy-blocked from
# *.azurecontainerapps.io the same way they're blocked from wikidata.org,
# see NOTES.md's 2026-07-09 entry) so a cold-start-vs-Supabase/captcha
# question can be answered with numbers instead of guesses.
#
# Three probes, in order:
# 1. One /health request — no Supabase call at all (AuthController never
#    touches ISupabaseAuthClient for this route), so this isolates
#    Container Apps' own cold-start cost (ADR-0004; minReplicas: 0) from
#    everything downstream of it.
# 2. Three immediate /health repeats — same route, now warm, for a
#    same-run baseline of "backend already up" latency.
# 3. Three POST /auth/login attempts with a deliberately-wrong password
#    and a deliberately-invalid captcha token. AuthController.Login checks
#    for a *non-blank* CaptchaToken locally before calling Supabase at all
#    (see AuthController.cs) — a non-blank-but-wrong token clears that
#    local check and still reaches Supabase's real
#    token?grant_type=password endpoint, so Supabase (and, transitively,
#    its own captcha verification against Cloudflare) is genuinely
#    exercised. The specific rejection reason (bad password vs bad
#    captcha) doesn't matter here — only the round-trip time to a
#    definitive answer does. No real account credentials are used or
#    needed.
#
# Not a permanent fixture: delete this file once the investigation this
# was written for is closed out, the same way a temporary debug flag would
# be removed rather than left behind.

on:
  workflow_dispatch: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 1 — /health, first request (cold start, if any)
        run: |
          curl -sS -o /dev/null -w "cold health:  http=%{http_code}  total=%{time_total}s  connect=%{time_connect}s  starttransfer=%{time_starttransfer}s\n" \
            "https://${{ secrets.DEV_BACKEND_HOSTNAME }}/health"

      - name: Probe 2 — /health, three immediate repeats (warm)
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null -w "warm health #$i: http=%{http_code}  total=%{time_total}s\n" \
              "https://${{ secrets.DEV_BACKEND_HOSTNAME }}/health"
          done

      - name: Probe 3 — POST /auth/login, three attempts (exercises Supabase + captcha verification)
        run: |
          for i in 1 2 3; do
            curl -sS -o /dev/null -w "login attempt #$i: http=%{http_code}  total=%{time_total}s\n" \
              -X POST "https://${{ secrets.DEV_BACKEND_HOSTNAME }}/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"latency-probe@example.invalid","password":"not-the-real-password","captchaToken":"latency-probe-invalid-token"}'
          done
