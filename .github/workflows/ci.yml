name: ci

# Tier 0 shape (see MVP-SCOPE.md): one environment (dev), so E2E runs
# against a LOCAL stack composed inside this workflow — a Postgres service
# container + the API run from source + the frontend dev server. No cloud
# dev environment, no test-data API, no DEV_* secrets needed.
#
# Tier 1 evolution (when the dev environment exists, ADR-0006): add back a
# `deploy-dev` job (build/push dev image, deploy Bicep with DEV_* secrets)
# and point an additional E2E run at the deployed dev env with the
# test-data reset call (REQ-802). That version is preserved in git history
# and described in infra/README.md — don't reintroduce it before Tier 1.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# dorny/test-reporter (all three jobs below) publishes a per-job Checks-tab
# report from each test run's output file, so pass/fail/new/removed tests
# are visible without opening logs — needs checks: write to create it.
permissions:
  contents: read
  checks: write

jobs:
  # Required status checks for `main` are the three job names below
  # (backend-tests/frontend-unit-tests/e2e-tests), confirmed against this
  # repo's actual branch protection settings — not dorny/test-reporter's
  # separate "* test results" Checks-tab entries. That's what makes the
  # `if:` skip below safe: GitHub reports a skipped *required* job as a
  # passing check, so auto-merge doesn't hang. A workflow-level
  # `paths-ignore` would NOT be safe here (unlike deploy.yml) — that
  # would stop the workflow from triggering at all for doc-only PRs, and
  # a required check whose workflow never runs stays "pending" forever
  # and blocks merge permanently. Filtering inside the workflow via this
  # job, instead, keeps the workflow triggering and the job posting a
  # result either way.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Only needed so paths-filter has local history to diff against on
      # `push` events (github.event.before..github.sha) — on `pull_request`
      # events it uses the GitHub API instead and this step is a no-op for
      # that purpose, but harmless to always run.
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!.claude/**'
              - '!mockups/**'

  backend-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore backend/XGArcade.sln
      - run: dotnet build backend/XGArcade.sln --no-restore --configuration Release
      - run: dotnet test backend/XGArcade.sln --no-build --configuration Release --logger "trx"
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Backend test results
          path: "backend/**/TestResults/*.trx"
          reporter: dotnet-trx
          # false: publish as its own Checks-tab entry (visible directly on
          # the PR) instead of dorny's default of a job-summary-only report,
          # which only shows up buried in the specific workflow run's page.
          use-actions-summary: false

  frontend-unit-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - name: Publish frontend unit test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Frontend unit test results
          path: "frontend/test-results/vitest-junit.xml"
          reporter: java-junit
          use-actions-summary: false

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [changes, backend-tests, frontend-unit-tests]
    # backend-tests/frontend-unit-tests already skip via the same
    # condition, which would skip this job automatically too (a skipped
    # `needs` job makes the default success() check fail) — spelled out
    # explicitly so the doc-only path is obvious from this job alone.
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xgarcade_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright's Chromium (+ OS deps)
        working-directory: frontend
        # Only chromium — playwright.config.ts doesn't run firefox/webkit
        # projects, so installing them would just be wasted download time.
        # --with-deps always reinstalls OS packages even on a browser-binary
        # cache hit (these runners are fresh VMs each run, so apt state
        # never persists) — but `playwright install` itself skips the slow
        # binary download once the cached version already matches, which is
        # most of what made this step slow.
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* || true
          npx playwright install --with-deps chromium
      # S-175: examined for the run-cli-verb composite action extraction and
      # deliberately left as a plain step, not converted — this step reuses
      # the e2e-tests job's own checkout/setup-dotnet (shared with
      # setup-node/npm ci/Playwright install above), and its connection
      # string is this job's own ephemeral local Postgres service container,
      # never secrets.DEV_DATABASE_CONNECTION_STRING — it isn't an instance
      # of the "checkout, setup-dotnet, run a CLI verb, connect to dev DB"
      # shape the composite action exists for, despite the similar name.
      - name: Migrate + seed local database
        run: dotnet run --project backend/src/XGArcade.Api -- migrate-and-seed
        env:
          ConnectionStrings__Database: "Host=localhost;Database=xgarcade_e2e;Username=postgres;Password=postgres"
      - name: Start API (background)
        run: |
          # --no-launch-profile: launchSettings.json's applicationUrl (port
          # 5028) otherwise overrides ASPNETCORE_URLS below, so the API binds
          # to the wrong port and the health-wait loop times out.
          dotnet run --project backend/src/XGArcade.Api --configuration Release --no-launch-profile &
          timeout 60 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
        env:
          ConnectionStrings__Database: "Host=localhost;Database=xgarcade_e2e;Username=postgres;Password=postgres"
          Auth__Mode: "local-e2e"   # bypasses Supabase JWT validation with a local test signer — never enabled outside Development
          ASPNETCORE_ENVIRONMENT: "Development"
          ASPNETCORE_URLS: "http://localhost:8080"
          Cors__AllowedOrigins: "http://localhost:5173"
          # REQ-606's 10/min-per-IP default is sized for real abuse, not for
          # one Playwright suite's full signup+auto-login traffic (every spec
          # file, all workers) landing on this one process from the single
          # runner IP within the same window. Raised here only — every other
          # environment keeps REQ-606's real 10.
          RateLimiting__AuthSignupPermitLimit: "1000"
          RateLimiting__AuthLoginPermitLimit: "1000"
      - name: E2E (Playwright against local stack)
        # playwright.config uses its `webServer` option to boot the Vite dev
        # server on :5173 itself — only the API needs manual starting above.
        # Dependencies/browser already installed above.
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:8080
      - name: Publish E2E test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: E2E test results
          path: "frontend/test-results/e2e-junit.xml"
          reporter: java-junit
          use-actions-summary: false