name: ci

# Tier 0 shape (see MVP-SCOPE.md): one environment (dev), so E2E runs
# against a LOCAL stack composed inside this workflow — a Postgres service
# container + the API run from source + the frontend dev server. No cloud
# dev environment, no test-data API, no DEV_* secrets needed.
#
# Tier 1 evolution (when the dev environment exists, ADR-0006): add back a
# `deploy-dev` job (build/push dev image, deploy Bicep with DEV_* secrets)
# and point an additional E2E run at the deployed dev env with the
# test-data reset call (REQ-802). That version is preserved in git history
# and described in infra/README.md — don't reintroduce it before Tier 1.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # On-demand trigger: this sandbox frequently has no `dotnet` SDK (see
  # CLAUDE.md "Testing without a local dotnet SDK"), so an agent validates
  # a pushed branch by running this workflow manually — via
  # `actions_run_trigger`'s `run_workflow` method (workflow_id: ci.yml,
  # ref: the branch) — instead of opening a PR just to get a test run.
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was triggered manually (e.g. pre-PR validation from an agent session without a local dotnet SDK)"
        required: false
        type: string

# dorny/test-reporter (all three jobs below) publishes a per-job Checks-tab
# report from each test run's output file, so pass/fail/new/removed tests
# are visible without opening logs — needs checks: write to create it.
permissions:
  contents: read
  checks: write

jobs:
  # Required status checks for `main` are the three job names below
  # (backend-tests/frontend-unit-tests/e2e-tests), confirmed against this
  # repo's actual branch protection settings — not dorny/test-reporter's
  # separate "* test results" Checks-tab entries. That's what makes the
  # `if:` skip below safe: GitHub reports a skipped *required* job as a
  # passing check, so auto-merge doesn't hang. A workflow-level
  # `paths-ignore` would NOT be safe here (unlike deploy.yml) — that
  # would stop the workflow from triggering at all for doc-only PRs, and
  # a required check whose workflow never runs stays "pending" forever
  # and blocks merge permanently. Filtering inside the workflow via this
  # job, instead, keeps the workflow triggering and the job posting a
  # result either way.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.manual.outputs.code || steps.filter.outputs.code }}
    steps:
      # Only needed so paths-filter has local history to diff against on
      # `push` events (github.event.before..github.sha) — on `pull_request`
      # events it uses the GitHub API instead and this step is a no-op for
      # that purpose, but harmless to always run.
      - uses: actions/checkout@v7
      # workflow_dispatch has no push/PR base for paths-filter to diff
      # against, and a manual trigger means someone explicitly wants the
      # suite run — so skip filtering entirely rather than guessing a base.
      - name: Manual dispatch always runs the full suite
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: echo "code=true" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # dorny/paths-filter's default predicate-quantifier ('some') treats
          # a file as matching if it matches ANY listed pattern, including
          # negated ones — i.e. it ignores the '!' exclusions entirely
          # (confirmed against the action's own docs, and the hard way: an
          # initial version of this filter without this setting matched a
          # docs/-only change and ran the full suite anyway). 'some-with-
          # excludes' is what actually makes '!docs/**' etc. exclude.
          predicate-quantifier: "some-with-excludes"
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!.claude/**'
              - '!mockups/**'

  backend-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore backend/XGArcade.sln
      - run: dotnet build backend/XGArcade.sln --no-restore --configuration Release
      - run: dotnet test backend/XGArcade.sln --no-build --configuration Release --logger "trx"
      - name: Publish backend test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Backend test results
          path: "backend/**/TestResults/*.trx"
          reporter: dotnet-trx
          # false: publish as its own Checks-tab entry (visible directly on
          # the PR) instead of dorny's default of a job-summary-only report,
          # which only shows up buried in the specific workflow run's page.
          use-actions-summary: false

  frontend-unit-tests:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - name: Publish frontend unit test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Frontend unit test results
          path: "frontend/test-results/vitest-junit.xml"
          reporter: java-junit
          use-actions-summary: false

  # S-237 / ADR-0084 CI backstop. Mechanical automation for two of the
  # three "Code health budget (per diff)" checks in docs/coding-
  # guidelines.md that quality-architect otherwise applies by hand on
  # every review (duplicated-shape rule-of-three, sibling-relative
  # god-file size — the churn-hotspot check stays judgment-based, it's
  # deliberately not part of this job, see docs/decisions/ for the
  # rationale). Not in this repo's branch-protection required-checks list
  # (only backend-tests/frontend-unit-tests/e2e-tests are, see the
  # `changes` job's comment above) — this job can go red without blocking
  # merge, a deliberate soft-fail/informational-for-now choice, also
  # documented in that ADR.
  code-health-budget:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: both checks diff against a base commit (PR base
          # branch or the pre-push tip) to tell new/changed content apart
          # from what already existed — a shallow clone wouldn't have that
          # history available to diff against.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Regression-test the budget-check scripts themselves
        # A backstop for the backstop: these scripts' own overlap-merge/
        # union-find (duplicate-shape) and blob-vs-tree-entry filtering
        # (god-file) logic is subtle enough to regress silently otherwise
        # — see the quality-gate review that caught a subdirectory-
        # miscounted-as-sibling bug here. Fails fast, before spending time
        # on the real jscpd scan below, if either script itself is broken.
        run: |
          node .github/scripts/tests/check-duplicate-shapes.test.mjs
          bash .github/scripts/tests/check-new-file-sizes.test.sh
      - name: Determine diff base and touched/added files
        id: diff
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              # Explicit refspec (not just `origin <base_ref>`): actions/
              # checkout doesn't always leave the standard
              # `+refs/heads/*:refs/remotes/origin/*` fetch refspec in
              # place, so this makes sure `origin/<base_ref>` actually
              # exists locally afterwards instead of relying on it. No
              # --depth here (unlike a throwaway shallow fetch elsewhere in
              # this file) — fetch-depth: 0 above already means full
              # history for every branch is available locally, and
              # git merge-base needs that full ancestry to find a common
              # commit with a feature branch that has diverged from a
              # `main` that's since moved on.
              git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
              base_sha=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
              git diff --name-only --diff-filter=ACMR "${base_sha}...HEAD" > /tmp/diff-touched-files.txt
              echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
              echo "mode=enforce" >> "$GITHUB_OUTPUT"
              ;;
            push)
              base_sha="${{ github.event.before }}"
              git diff --name-only --diff-filter=ACMR "${base_sha}..${{ github.sha }}" > /tmp/diff-touched-files.txt
              echo "base_sha=${base_sha}" >> "$GITHUB_OUTPUT"
              echo "mode=enforce" >> "$GITHUB_OUTPUT"
              ;;
            workflow_dispatch)
              # No base to diff against, and a manual trigger means someone
              # explicitly wants to see what the checks report — same
              # "report, don't enforce" choice the `changes` job makes for
              # path filtering on this event.
              : > /tmp/diff-touched-files.txt
              echo "base_sha=" >> "$GITHUB_OUTPUT"
              echo "mode=report-only" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "Diff-touched files:"
          cat /tmp/diff-touched-files.txt
      - name: Duplicate-shape scan (frontend/src, jscpd)
        working-directory: frontend
        run: |
          mkdir -p /tmp/jscpd-report
          # jscpd@5.2.0 pinned exactly (this repo's devDependencies use
          # caret ranges for things it builds against long-term; a
          # one-shot CI tool invoked via npx is pinned exactly instead, so
          # a new jscpd release can't silently change what this job
          # flags). min-tokens/min-lines are jscpd's own defaults, kept
          # explicit here rather than implicit, and landed on after
          # validating them against this tree (see the ADR for this
          # story) — deliberately permissive per the backlog's own
          # "start permissive" instruction, since 3+ grouping (done by the
          # next step, jscpd has no such concept itself) is what actually
          # keeps this from being noisy. mode=mild (default) + no
          # --ignore-identifiers/--ignore-literals: only *exact* token
          # matches count, not "same shape, different names" — the latter
          # is closer to code-health-auditor's judgment-based sweep than
          # something this backstop should attempt.
          npx --yes jscpd@5.2.0 src \
            --format typescript,tsx \
            --ignore "**/*.test.ts,**/*.test.tsx,**/*.d.ts" \
            --min-tokens 50 \
            --min-lines 5 \
            --mode mild \
            --reporters json,console \
            --no-colors \
            --output /tmp/jscpd-report
      - name: Evaluate duplicate-shape budget
        id: duplicate-shapes
        run: |
          node .github/scripts/check-duplicate-shapes.mjs \
            /tmp/jscpd-report/jscpd-report.json \
            /tmp/diff-touched-files.txt \
            "${{ steps.diff.outputs.mode }}"
      - name: Evaluate god-file/sibling-size budget
        # Runs even if the duplicate-shape step above failed, so both
        # checks always get a chance to report — the job as a whole still
        # ends up red if either one failed (GitHub Actions' default: a job
        # fails if any of its steps fail, `if: always()` only controls
        # whether *this* step still runs, not the job's overall outcome).
        if: always()
        run: |
          bash .github/scripts/check-new-file-sizes.sh "${{ steps.diff.outputs.base_sha }}"

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [changes, backend-tests, frontend-unit-tests]
    # backend-tests/frontend-unit-tests already skip via the same
    # condition, which would skip this job automatically too (a skipped
    # `needs` job makes the default success() check fail) — spelled out
    # explicitly so the doc-only path is obvious from this job alone.
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xgarcade_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Get installed Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright's Chromium (+ OS deps)
        working-directory: frontend
        # Only chromium — playwright.config.ts doesn't run firefox/webkit
        # projects, so installing them would just be wasted download time.
        # --with-deps always reinstalls OS packages even on a browser-binary
        # cache hit (these runners are fresh VMs each run, so apt state
        # never persists) — but `playwright install` itself skips the slow
        # binary download once the cached version already matches, which is
        # most of what made this step slow.
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/* || true
          npx playwright install --with-deps chromium
      # S-175: examined for the run-cli-verb composite action extraction and
      # deliberately left as a plain step, not converted — this step reuses
      # the e2e-tests job's own checkout/setup-dotnet (shared with
      # setup-node/npm ci/Playwright install above), and its connection
      # string is this job's own ephemeral local Postgres service container,
      # never secrets.DEV_DATABASE_CONNECTION_STRING — it isn't an instance
      # of the "checkout, setup-dotnet, run a CLI verb, connect to dev DB"
      # shape the composite action exists for, despite the similar name.
      - name: Migrate + seed local database
        run: dotnet run --project backend/src/XGArcade.Api -- migrate-and-seed
        env:
          ConnectionStrings__Database: "Host=localhost;Database=xgarcade_e2e;Username=postgres;Password=postgres"
      - name: Start API (background)
        run: |
          # --no-launch-profile: launchSettings.json's applicationUrl (port
          # 5028) otherwise overrides ASPNETCORE_URLS below, so the API binds
          # to the wrong port and the health-wait loop times out.
          dotnet run --project backend/src/XGArcade.Api --configuration Release --no-launch-profile &
          timeout 60 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
        env:
          ConnectionStrings__Database: "Host=localhost;Database=xgarcade_e2e;Username=postgres;Password=postgres"
          Auth__Mode: "local-e2e"   # bypasses Supabase JWT validation with a local test signer — never enabled outside Development
          ASPNETCORE_ENVIRONMENT: "Development"
          ASPNETCORE_URLS: "http://localhost:8080"
          Cors__AllowedOrigins: "http://localhost:5173"
          # REQ-606's 10/min-per-IP default is sized for real abuse, not for
          # one Playwright suite's full signup+auto-login traffic (every spec
          # file, all workers) landing on this one process from the single
          # runner IP within the same window. Raised here only — every other
          # environment keeps REQ-606's real 10.
          RateLimiting__AuthSignupPermitLimit: "1000"
          RateLimiting__AuthLoginPermitLimit: "1000"
          # S-245 (REQ-501/509/510): admin-review.spec.ts needs one E2E
          # account recognized as admin (AdminAuthorizationHandler reads this
          # exact env var — see AdminAuthorization.cs). No admin E2E coverage
          # existed before this story, so this var was never set here.
          # LocalE2EAuthClient.DeterministicGuid derives an authProviderUserId
          # from `email.Trim().ToLowerInvariant()` via
          # `new Guid(MD5.HashData(...))` — this is that deterministic GUID
          # for the fixed email "e2e-admin@test.invalid", which
          # admin-review.spec.ts signs up as to become admin. Not tied to any
          # real Supabase identity — this whole mechanism only exists in
          # Auth__Mode=local-e2e (Development-only, see LocalE2EAuth.cs).
          Admin__UserIds: "03a57244-ba5b-782e-303b-37cd79dc9d18"
      - name: E2E (Playwright against local stack)
        # playwright.config uses its `webServer` option to boot the Vite dev
        # server on :5173 itself — only the API needs manual starting above.
        # Dependencies/browser already installed above.
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:5173
          VITE_API_BASE_URL: http://localhost:8080
      - name: Publish E2E test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: E2E test results
          path: "frontend/test-results/e2e-junit.xml"
          reporter: java-junit
          use-actions-summary: false