name: prefetch-player-careers

# ADR-0055 (2026-08-02): proactively fills PlayerCareerStint for every seeded
# country's full eligible player pool, independent of whatever xG Grid's own
# country/club lookups have happened to query so far (ADR-0042's byproduct
# model) — this is what actually widens xG Path's target-player pool
# (XGPathGameModule.GetEligiblePlayerIdsAsync), not just enriches an
# already-selected target the way PlayerCareerStintRefreshService (ADR-0054)
# does.
#
# A plain CLI job (`dotnet run -- prefetch-player-careers`,
# PlayerCareerPrefetchService's own doc comment has the full reasoning), not
# an HTTP endpoint against the deployed backend — same ADR-0024 "long-running
# bulk job is a CLI verb, never a fire-and-forget background task or a long
# HTTP endpoint" reasoning as warm-player-cache.yml/import-player-name-index.yml.
#
# Weekly cron (ADR-0055 follow-up, resolved 2026-08-16): the query shape this
# ADR flagged as unproven at scale (a single seeded country's full unsliced
# player pool) is no longer unproven — its first real run (2026-08-02, see
# NOTES.md) never failed on the WDQS server-cap risk this ADR anticipated,
# including for huge pools (United Kingdom: 18,460 players; Brazil: 10,949;
# Germany: 10,128). The run's only failure (4 batches hitting the 15s default
# timeout) was fixed with a 60s `queryTimeout` override, and NOTES.md's
# 2026-08-03 entry confirms the subsequent clean run populated 607,914 real
# `PlayerCareerStint` rows. ADR-0055's own Follow-up section says this can
# "reasonably move to ... recurring cron once a clean full run confirms the
# fix" — that confirmation already happened, so this was just never flipped.
# Offset 30 minutes after promote-dev-to-prod-dry-run.yml's own weekly slot,
# same "don't compete for the same time slot" reasoning as
# warm-player-cache.yml/import-player-name-index.yml. workflow_dispatch stays
# available for an on-demand run.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 7 * * 0" # weekly, Sunday 07:00 UTC

jobs:
  prefetch-player-careers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Prefetch player careers
        run: dotnet run --project backend/src/XGArcade.Api -- prefetch-player-careers
        env:
          ConnectionStrings__Database: ${{ secrets.DEV_DATABASE_CONNECTION_STRING }}
