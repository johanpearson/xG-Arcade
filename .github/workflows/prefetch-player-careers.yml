name: prefetch-player-careers

# ADR-0055 (2026-08-02): proactively fills PlayerCareerStint for every seeded
# country's full eligible player pool, independent of whatever xG Grid's own
# country/club lookups have happened to query so far (ADR-0042's byproduct
# model) — this is what actually widens xG Path's target-player pool
# (PathEligibilityService.GetEligiblePlayerIdsAsync), not just enriches an
# already-selected target the way PlayerCareerStintRefreshService (ADR-0054)
# does.
#
# ADR-0069 (2026-08-17): also sweeps every seeded club's full eligible
# player pool, in addition to the countries sweep above — so a player from
# an unseeded country who played for a seeded club is no longer invisible
# to this job. Same job, same verb, widened; not a second workflow.
#
# A plain CLI job (`dotnet run -- prefetch-player-careers`,
# PlayerCareerPrefetchService's own doc comment has the full reasoning), not
# an HTTP endpoint against the deployed backend — same ADR-0024 "long-running
# bulk job is a CLI verb, never a fire-and-forget background task or a long
# HTTP endpoint" reasoning as warm-grid-cache.yml/import-player-name-index.yml.
#
# Manual trigger only, deliberately NOT on the same weekly cron
# warm-grid-cache/import-player-name-index just moved to (ADR-0055) — this
# is a brand-new, unproven query shape (a single seeded country's or seeded
# club's full unsliced player pool; ADR-0055's own "Open questions" flags
# that a large country like Brazil/England could plausibly be large enough
# to strain WDQS's ~60s server-side cap the way import-player-name-index's
# original unsliced design once did — the same open question now also
# applies to a very large club's full historical squad). Confirm a real
# run's cost/runtime/failure pattern manually first; put this on a
# recurring schedule only once that's actually confirmed, not before.
#
# 2026-08-17 status: first real run against a fully-purged pool (S-038,
# post ADR-0069's club sweep) completed its full country+club pass in ~88
# of its then-90-minute cap, touching 193,382 players / 527,252 stints —
# the per-country/per-club query shape itself is fine at this scale. It
# still exited nonzero: 37 career-fetch batches hit transient WDQS 502s and
# 2 countries (Sweden, Canada) failed their pool fetch — scattered across
# the whole run, not a contiguous run against the same club/country
# (ADR-0055's own "watch for a long contiguous stretch, not raw failure
# count" monitoring guidance), so this reads as ordinary WDQS load
# flakiness under a much heavier combined sweep, not a structural bug —
# same class as this file's own earlier documented incident. Re-running is
# idempotent and expected to converge. Timeout raised below to give real
# headroom given 88/90 minutes was uncomfortably tight.
#
# 2026-08-25 status (REQ-110/ADR-0088/S-186, Supabase free-tier egress
# incident): the "no skip-already-processed shortcut" gap flagged above no
# longer applies — PlayerCareerPrefetchService now skips any country/club
# whose pool was already fully swept (PlayerPoolSweptAt non-null), so a
# retry after a transient failure like the above only re-sweeps what
# actually failed, not the whole pool again. That gap, combined with 9
# manual re-dispatches in ~36 hours chasing exactly this kind of transient
# WDQS failure, is the confirmed root cause of a ~1.3GB single-day Supabase
# egress spike that pushed the org over its free-tier quota. The
# concurrency group below is the second, independent half of that fix: it
# prevents a burst of re-dispatches from ever running two full sweeps
# against Supabase in parallel again, queuing instead of cancelling since a
# real in-flight sweep is expensive to redo.

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prefetch-player-careers:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Prefetch player careers
        uses: ./.github/actions/run-cli-verb
        with:
          verb: prefetch-player-careers
          connection-string: ${{ secrets.DEV_DATABASE_CONNECTION_STRING }}
