name: generate-higher-lower-round

# Creates a new Round + HigherLowerInstance for GameKey "xg-higher-lower"
# per the configured frequency (REQ-301, REQ-1505). This story: wired
# "xg-higher-lower" into round scheduling alongside xG Grid's/xG Path's/xG
# Predict's — the existing resolver/single-endpoint design (ADR-0051,
# ADR-0072) applies unchanged to this fourth GameKey.
#
# Unlike generate-predict-round.yml, this GameKey uses plain chain-math
# timing (StartTime = the previous round's own EndTime, EndTime = StartTime
# + RoundDuration) the same way generate-grid-round.yml/
# generate-path-round.yml do — XGHigherLowerGameModule.GenerateInstanceAsync
# never sets GameInstance.SuggestedStartTime/SuggestedEndTime, so there is
# no real-fixture-kickoff override here the way xg-predict has.
#
# Cadence: daily (06:00 UTC), deliberately NOT coupled to
# XGArcade.Api/appsettings.json's
# RoundScheduling:XGHigherLower:RoundDurationHours default (48h) — relies on
# RoundGenerationService's own idempotency skip to no-op on days the current
# round hasn't ended yet, giving a constant 24h safety margin under any
# RoundDurationHours >= 24 instead of an exact-equality cron match. Full
# reasoning and the rejected `*/2` day-of-month alternative: ADR-0027.
#
# This workflow is one of four fully independent files
# (generate-grid-round.yml, generate-path-round.yml, generate-predict-round.yml,
# and this one) — nothing server-side requires them to stay coupled:
# RoundSchedulingOptions is already fully per-GameKey
# (IRoundSchedulingOptionsResolver, ADR-0051) and /internal/generate-round
# already takes gameKey as a first-class parameter with no other
# game-specific branching. This workflow's own cron independently satisfies
# ADR-0027's "RoundDuration >= cron's max gap" invariant against xG
# Higher/Lower's own configured RoundDurationHours (currently 48h,
# comfortably >= this workflow's own 24h daily max gap).
#
# workflow_dispatch accepts an optional round_duration_hours input for a
# one-off manual override (passed through as /internal/generate-round's
# roundDurationHours query param), affecting ONLY "xg-higher-lower" — mirrors
# the other three workflows' own input, each already independent of the
# others (ADR-0072). This does NOT change xG Higher/Lower's configured
# default and does NOT require touching this cron; only a *lasting* change
# to the default needs RoundScheduling:XGHigherLower:RoundDurationHours —
# or the deployed Container App's matching
# RoundScheduling__XGHigherLower__RoundDurationHours env var — changed
# instead.
#
# The retry-loop body lives in .github/actions/trigger-round-generation
# (S-176) — only the retry logic is shared; this workflow's own `on:` block
# below (cron + workflow_dispatch input) stays fully independent.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      round_duration_hours:
        description: "One-off RoundDuration override (hours) for this xg-higher-lower generation call only. Leave blank to use xg-higher-lower's own configured default."
        type: string
        required: false

jobs:
  generate-higher-lower-round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trigger round generation
        uses: ./.github/actions/trigger-round-generation
        with:
          game-key: xg-higher-lower
          round-duration-hours: ${{ inputs.round_duration_hours }}
          backend-hostname: ${{ secrets.DEV_BACKEND_HOSTNAME }}
          internal-job-token: ${{ secrets.INTERNAL_JOB_TOKEN }}
