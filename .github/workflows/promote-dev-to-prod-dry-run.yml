name: promote-dev-to-prod-dry-run

# Scheduled early-warning check for the RECOMMENDED sync direction
# (ADR-0009): runs `promote-dev-to-prod.sh --dry-run` on a cadence and
# surfaces the per-table dev/prod row-count diff on the workflow run's job
# summary, so drift is visible before a human runs the real (writing)
# promote by hand. This workflow NEVER writes to prod, and deliberately
# has no way to: there is no --yes/non-interactive flag on the real
# (non-dry-run) path of promote-dev-to-prod.sh, and none should be added —
# that was explicitly considered and rejected in favor of this
# scheduled-dry-run-plus-manual-confirm approach. The actual promote still
# requires a human to run promote-dev-to-prod.sh directly and type the
# confirmation phrase.
#
# Prod doesn't exist yet (MVP-SCOPE.md's Tier 1 bright line) — no PROD_*
# secrets are configured in this repo by design (see infra/README.md).
# Rather than going red every week until Tier 1 arrives, the first step
# checks for PROD_DATABASE_CONNECTION_STRING and exits cleanly with a log
# line (and a job-summary note) if it's unset — same spirit as
# Program.cs's `ASPNETCORE_ENVIRONMENT != Production` gate for
# /internal/test-data/*: detect "not applicable yet" and no-op quietly
# rather than erroring.
#
# Surfacing mechanism: the GitHub Actions job summary ($GITHUB_STEP_SUMMARY),
# not a GitHub issue or a chat/webhook post. No Slack/webhook secret is
# configured anywhere in this repo today (checked infra/README.md's
# secrets table and every other workflow's `secrets.*` references), and no
# existing workflow opens or updates a tracking issue — a job summary is
# the option that fits this repo's current conventions without adding a
# new secret dependency or a new kind of automation surface. Revisit if a
# job summary proves too easy to miss in practice.
#
# Weekly cron, this repo's established default for maintenance-style
# scheduled jobs (see warm-player-cache.yml / import-player-name-index.yml).
# Offset from both of those (03:00 / 04:30 UTC Sunday) and from
# backup-database.yml's daily 02:00 UTC run, so none of them compete for
# the same time slot.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 5 * * 0" # weekly, Sunday 05:30 UTC

jobs:
  dry-run-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_CONNECTION_STRING }}
      DEV_DATABASE_URL: ${{ secrets.DEV_DATABASE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v7

      - name: Check prod is configured
        id: check
        run: |
          if [[ -z "$PROD_DATABASE_URL" ]]; then
            echo "PROD_DATABASE_CONNECTION_STRING is not set — prod doesn't exist yet (Tier 1, MVP-SCOPE.md). Nothing to check; exiting cleanly."
            {
              echo "## promote-dev-to-prod dry run"
              echo "Skipped: prod isn't configured yet (Tier 1, MVP-SCOPE.md). Nothing to check."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install postgresql-client
        if: steps.check.outputs.configured == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run dry run and write summary
        if: steps.check.outputs.configured == 'true'
        run: |
          {
            echo "## promote-dev-to-prod dry run"
            echo '```'
            bash infra/scripts/promote-dev-to-prod.sh --dry-run
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
