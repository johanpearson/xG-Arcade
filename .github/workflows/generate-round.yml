name: generate-round

# Creates a new Round + game instance per the configured frequency (REQ-301).
# S-008 (docs/backlog.md): Core.Rounds' RoundGenerationService now backs
# /internal/generate-round, so this cron is enabled.
#
# Cadence: daily (06:00 UTC), deliberately NOT coupled to
# XGArcade.Api/Program.cs's RoundScheduling:RoundDurationHours default (48h)
# — relies on RoundGenerationService's own idempotency skip to no-op on days
# the current round hasn't ended yet, giving a constant 24h safety margin
# under any RoundDurationHours >= 24 instead of an exact-equality cron match.
# Full reasoning and the rejected `*/2` day-of-month alternative: ADR-0027.
#
# workflow_dispatch accepts an optional round_duration_hours input for a
# one-off manual override (passed through as /internal/generate-round's
# roundDurationHours query param) — this does NOT change the configured
# default and does NOT require touching this cron; only a *lasting* change
# to the default needs RoundScheduling:RoundDurationHours (or the deployed
# Container App's RoundScheduling__RoundDurationHours env var) changed
# instead.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      round_duration_hours:
        description: "One-off RoundDuration override (hours) for this generation call only. Leave blank to use the configured default."
        type: string
        required: false

jobs:
  generate-round:
    runs-on: ubuntu-latest
    steps:
      # Bug-bundle follow-up (2026-07-27): a single failed attempt (e.g. a
      # transient Wikidata hiccup during header-picking, ADR-0023) previously
      # meant waiting for tomorrow's cron — REQ-301's "one round ahead" design
      # tolerates that gap without players noticing, but there's no reason to
      # accept it when a same-run retry is free and safe: RoundGenerationService
      # is idempotent (this workflow's own top comment) and ADR-0023's
      # MaxDuration abort happens before a Round is ever persisted, so a
      # retried call can never create a duplicate or partial round. 3 attempts,
      # 30s/60s backoff — generous relative to ADR-0023's own 90s per-attempt
      # budget, cheap relative to a whole day's wait.
      - name: Trigger round generation
        run: |
          url="https://${{ secrets.DEV_BACKEND_HOSTNAME }}/internal/generate-round"
          if [ -n "${{ inputs.round_duration_hours }}" ]; then
            url="${url}?roundDurationHours=${{ inputs.round_duration_hours }}"
          fi

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            http_status=$(curl -sS -o response.json -w "%{http_code}" -X POST \
              "$url" \
              -H "Authorization: Bearer ${{ secrets.INTERNAL_JOB_TOKEN }}")

            echo "Attempt $attempt/$max_attempts — response body:"
            cat response.json

            if [ "$http_status" -lt 400 ]; then
              exit 0
            fi

            echo "::warning::/internal/generate-round returned HTTP $http_status (attempt $attempt/$max_attempts)"

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 30))
            fi
          done

          echo "::error::/internal/generate-round failed after $max_attempts attempts (last status: $http_status)"
          exit 1
