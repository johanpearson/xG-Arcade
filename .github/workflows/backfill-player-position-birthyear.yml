name: backfill-player-position-birthyear

# REQ-1207 backfill (bug-bundle fix, 2026-08-02): fills Player.Position/
# Player.BirthYear for every Player row that predates migration
# 20260727140000_AddPlayerPositionAndBirthYear's P413/P569 addition to
# WikidataClient's intersection queries —
# PlayerStoreRepository.GetOrCreatePlayersByWikidataQidAsync only ever sets
# these at the moment a Player row is first created, so any row created by
# an earlier warm-player-cache run (or before that migration shipped) has
# both permanently NULL with no other code path that will ever revisit
# them. See PlayerPositionBirthYearBackfillService's own doc comment for the
# full reasoning — an exact mirror of backfill-player-photos.yml.
#
# A plain CLI job (`dotnet run -- backfill-player-position-birthyear`), not
# an HTTP endpoint — same ADR-0024 reasoning as backfill-player-photos.yml:
# this can take a while (one live Wikidata call per 200-player batch), and a
# GitHub Actions job has a generous default timeout unlike the deployed
# backend's own HTTP ingress (~240s).
#
# Manual trigger only, no recurring schedule — idempotent and safe to
# re-run at any time (only ever writes rows still missing Position and/or
# BirthYear), so there's no need for a fixed cadence; run it once to clear
# the existing backlog, and again later only if a fresh warm-player-cache
# run created more Player rows in the meantime.

on:
  workflow_dispatch: {}

jobs:
  backfill-player-position-birthyear:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Backfill player position and birth year
        run: dotnet run --project backend/src/XGArcade.Api -- backfill-player-position-birthyear
        env:
          ConnectionStrings__Database: ${{ secrets.DEV_DATABASE_CONNECTION_STRING }}
