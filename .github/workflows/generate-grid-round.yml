name: generate-grid-round

# Creates a new Round + GridInstance for GameKey "xg-grid" per the
# configured frequency (REQ-301).
# S-008 (docs/backlog.md): Core.Rounds' RoundGenerationService now backs
# /internal/generate-round, so this cron is enabled.
#
# Cadence: daily (06:00 UTC), deliberately NOT coupled to
# XGArcade.Api/Program.cs's RoundScheduling:RoundDurationHours default (48h)
# — relies on RoundGenerationService's own idempotency skip to no-op on days
# the current round hasn't ended yet, giving a constant 24h safety margin
# under any RoundDurationHours >= 24 instead of an exact-equality cron match.
# Full reasoning and the rejected `*/2` day-of-month alternative: ADR-0027.
#
# S-136 (ADR-0072): this workflow used to be one half of a shared
# generate-round.yml that looped over both "xg-grid" and "xg-path" in the
# same job — split into its own file, independent of xG Path's
# generate-path-round.yml, because nothing server-side requires them to
# stay coupled: RoundSchedulingOptions is already fully per-GameKey
# (IRoundSchedulingOptionsResolver, ADR-0051) and /internal/generate-round
# already takes gameKey as a first-class parameter with no other
# game-specific branching. This workflow's own cron independently satisfies
# ADR-0027's "RoundDuration >= cron's max gap" invariant against xG Grid's
# own configured RoundDurationHours (currently 48h, comfortably >= this
# workflow's own 24h daily max gap) — see ADR-0072 for the full derivation
# and why re-verifying this independently, rather than assuming the old
# shared-cron proof still holds, matters now that the two workflows'
# schedules and RoundDurationHours can diverge.
#
# workflow_dispatch accepts an optional round_duration_hours input for a
# one-off manual override (passed through as /internal/generate-round's
# roundDurationHours query param), affecting ONLY "xg-grid" — this workflow
# is now independent of generate-path-round.yml, fixing a bug in the old
# shared workflow where supplying this input during a manual dispatch
# silently applied to both games at once (ADR-0072). This does NOT change
# xG Grid's configured default and does NOT require touching this cron;
# only a *lasting* change to the default needs
# RoundScheduling:RoundDurationHours — or the deployed Container App's
# matching RoundScheduling__RoundDurationHours env var — changed instead.
#
# S-176: the retry-loop body itself (previously an inline `generate_round()`
# bash function, byte-identical to generate-path-round.yml's copy) now lives
# in .github/actions/trigger-round-generation — only the retry logic is
# shared; this workflow's own `on:` block above (cron + workflow_dispatch
# input) stays fully independent, per architecture-reviewer's confirmation
# that a composite action (no trigger surface of its own) doesn't
# reintroduce the coupling ADR-0072 deliberately split apart.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      round_duration_hours:
        description: "One-off RoundDuration override (hours) for this xg-grid generation call only. Leave blank to use xg-grid's own configured default."
        type: string
        required: false

jobs:
  generate-grid-round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trigger round generation
        uses: ./.github/actions/trigger-round-generation
        with:
          game-key: xg-grid
          round-duration-hours: ${{ inputs.round_duration_hours }}
          backend-hostname: ${{ secrets.DEV_BACKEND_HOSTNAME }}
          internal-job-token: ${{ secrets.INTERNAL_JOB_TOKEN }}
